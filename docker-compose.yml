# `db` is ALWAYS started by `docker compose up -d` (no profile). The app
# itself is OPT-IN via the "app" profile (`docker compose --profile app up
# -d`) so a native `python -m streamlit run ...` workflow is unaffected by
# just running `docker compose up -d` for the database alone (unchanged
# since M1). `ollama-docker` is a SEPARATE, never-started-by-default profile
# for Linux users without a native Ollama install -- on Windows, native
# Ollama (with GPU access) is the supported, documented setup; this project
# NEVER runs Ollama in Docker on the GPU machine. See docs/07_docker.md.
#
# All ports are bound to 127.0.0.1 only (never 0.0.0.0): reachable from the
# host, never exposed on the network.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maintidoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maintidoc}
      POSTGRES_DB: ${POSTGRES_DB:-maintidoc}
    ports:
      # Host port 5433 (not 5432): this dev machine already runs another
      # PostgreSQL instance natively on 5432. Adjust DATABASE_URL in .env to match.
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maintidoc} -d ${POSTGRES_DB:-maintidoc}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # M7.5: the Streamlit UI + RAG/agent code, CPU-only (default profile for
  # both the GPU owner -- who still uses NATIVE Ollama, never dockerised --
  # and the no-GPU colleague on OpenRouter). "docker compose --profile app
  # up -d" starts this alongside `db`.
  app: &app
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - .env
    environment:
      # Overrides .env's host-facing values with the in-network/in-container
      # equivalents -- never baked into the image, never hardcoded secrets.
      DATABASE_URL: postgresql://${POSTGRES_USER:-maintidoc}:${POSTGRES_PASSWORD:-maintidoc}@db:5432/${POSTGRES_DB:-maintidoc}
      # Reaches the GPU owner's NATIVE Ollama install on the Windows host
      # (never a dockerised Ollama) -- requires extra_hosts below on Linux;
      # Docker Desktop (Windows/Mac) resolves this hostname natively.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DEVICE: cpu
      EMBED_QUERY_DEVICE: cpu
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # HF model cache (BGE-M3, MobileCLIP): downloaded once, reused across
      # restarts/rebuilds -- never re-downloaded just because the container
      # was recreated.
      - hf_cache:/app/models
      # The single input PDF, extracted images/tables and the processed
      # manifest -- survives `docker compose down` / `up` (a real volume,
      # not a container layer) and is also where an uploaded PDF (section 4)
      # lands.
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional GPU variant (`docker compose --profile gpu up -d app-gpu`):
  # needs WSL2 + the NVIDIA Container Toolkit (see docs/07_docker.md). Not
  # used by the documented workflow (the GPU owner runs Ollama NATIVELY and
  # the Streamlit container stays CPU-only -- BGE-M3/MobileCLIP CPU
  # inference is already fast enough); provided for completeness/Linux
  # users who want embeddings on a dockerised GPU too.
  app-gpu:
    <<: *app
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-maintidoc}:${POSTGRES_PASSWORD:-maintidoc}@db:5432/${POSTGRES_DB:-maintidoc}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DEVICE: cuda
      EMBED_QUERY_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Never started by default (no profile = "app"/"gpu", a SEPARATE,
  # explicit "ollama-docker" profile): `docker compose --profile
  # ollama-docker up -d`. For a Linux user with no native Ollama install
  # only -- the GPU owner's Windows machine always uses native Ollama.
  ollama-docker:
    profiles: ["ollama-docker"]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  db_data:
  ollama_data:
  hf_cache:
